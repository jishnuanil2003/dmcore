{% extends 'dmhead/dmheadsidebar.html' %}
{% load static %}

{% block title %}Employee Works{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'dm_head/css/common.css' %}">
<link rel="stylesheet" href="{% static 'dm_head/css/works.css' %}">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>
        body {
      overflow-x: hidden;
      
      background-color: #12151e; 
    }
</style>

<nav aria-label="breadcrumb">
  <ol class="breadcrumb text-white">
    <li class="breadcrumb-item">
      <a href="{% url 'employees' %}" class="text-decoration-none text-white">Employee</a>
    </li>
    <li class="breadcrumb-item active text-white-50" aria-current="page">Employee Works</li>
  </ol>
</nav>

<div class="container-fluid mt-3 comn_table_bg">
    <div class="row">
        <div class="col-12 col-md-6">
            <h3 class="text-light">List Of Works</h3>
            <p class="small">
                A list of works that employee work on for different clients
            </p>
        </div>

        <!-- //  dropdown, search -->
        <div class="col-12 col-md-6 d-flex justify-content-md-end align-items-start mt-2 mt-md-0">
            <div class="d-flex gap-2">

                <select class="form-select form-select-sm" id="employeeSelect">
                    <option value="">--- select employee ---</option>
                    {% for emp in search_users %}
                        <option
                            value="{{ emp.id }}"
                            data-company-id="{{ emp.company_id }}"
                            data-department-id="{{ emp.department_id }}"
                            data-designation-id="{{ emp.designation_id }}"
                            data-employee-code="{{ emp.employee_code }}">
                            {{ emp.name }}
                        </option>
                    {% endfor %}
                </select>
                
                <button class="btn btn-outline-primary btn-sm" id="searchBtn">
                    <i class="fa fa-search"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- // cards -->
    <div class="row mt-4">
        <!-- // In Progress -->
        <div class="col-12 col-md-6">
            <h5 class="text-light">In Progress</h5>

            <div id="inProgressContainer" class="mt-3">
                <!-- // will be filled from js -->
            </div>
        </div>

        <!-- // Completed -->
        <div class="col-12 col-md-6">
            <h5 class="text-light">Completed</h5>

            <div id="completedContainer" class="mt-3">
                <!-- // will be filled from js -->
            </div>
        </div>
    </div>
</div>

<script>
    window.DM_WORKS_SEARCH_URL = "{% url 'dm_works_search' %}";
    window.DM_WORK_DETAIL_URL_TEMPLATE = "{% url 'dm_work_details' 0 %}";
</script>
<script src="{% static 'dm_head/js/works.js' %}"></script>



{% endblock %}
