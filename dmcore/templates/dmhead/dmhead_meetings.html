{% extends "dmhead/dmheadsidebar.html" %}
{% load static %}
{% block content %}

<link rel="stylesheet" href="{% static 'datamanager/css/common.css' %}">
<link rel="stylesheet" href="{% static 'datamanager/css/dashboard.css' %}">

<style>
    body {
      overflow-x: hidden;
      
      background-color: #12151e; 
    }
</style>

<nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="" class="text-decoration-none text-white">Dashboard</a></li>
        <li class="breadcrumb-item active text-white-50" aria-current="page">Employees</li>
    </ol>
</nav>
<div class="container mt-3">
  <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4">
   {% for emp in telecallers %}

    <div class="col-md-4 mb-4">
      <div class="card card-common">
        <a href="{% url 'dmhead_leads_meet' emp.id %}" class="text-decoration-none text-white d-flex flex-column justify-content-around h-100">
          <div class="d-flex justify-content-between align-items-center mb-2 gap-2">
            <h5 class="mb-0">{{ emp.name }}</h5>
          </div>
          <p>Clicks to view all leads Meeting Details.</p>
        </a>
      </div>
    </div>
    {% empty %}
        <p style="color: red;">No Telecaller  Found</p>
    {% endfor %}


  </div>
</div>


{% endblock content %}
