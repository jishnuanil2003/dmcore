{% extends "datamanager/datamanagersidebar.html" %}
{% load static %}
{% block content %}

<style>
.page-wrapper{
    display:flex;
    justify-content:center;
    padding:40px 20px;
}

.bottle-card{
    width:100%;
    max-width:600px;
    background:rgba(18,25,48,.95);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,.35);
}

.bottle-header{
    background:rgba(255,255,255,.06);
    border-bottom:1px solid rgba(255,255,255,.08);
    padding:18px 25px;
}

.bottle-header h3{
    color:#fff;
    margin:0;
    font-size:24px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:10px;
}

.bottle-body{
    padding:25px;
}

.form-label{
    color:#fff;
    font-size:15px;
    font-weight:600;
    margin-bottom:8px;
}

.form-control{
    height:52px;
    background:#0f172a;
    border:1px solid #2b3653;
    border-radius:10px;
    color:#fff;
    font-size:15px;
}

.form-control::placeholder{
    color:#8f9bb3;
}

.form-control:focus{
    background:#0f172a;
    border-color:#0d6efd;
    color:#fff;
    box-shadow:0 0 0 .15rem rgba(13,110,253,.15);
}

.save-btn{
    min-width:180px;
    height:48px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#0d6efd,#3b82f6);
    font-size:15px;
    font-weight:600;
    transition:.3s;
}

.save-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 5px 15px rgba(13,110,253,.3);
}

.btn-wrapper{
    text-align:center;
    margin-top:25px;
}

.alert{
    border-radius:10px;
    margin-bottom:20px;
}

.alert-success{
    background:#113826;
    border:1px solid #1f7a4d;
    color:#b8ffd5;
}

.alert-danger{
    background:#3a1218;
    border:1px solid #842029;
    color:#ffb3bd;
}

@media(max-width:768px){

    .page-wrapper{
        padding:20px 12px;
    }

    .bottle-card{
        max-width:100%;
    }

    .bottle-body{
        padding:20px;
    }

    .bottle-header h3{
        font-size:20px;
    }

    .save-btn{
        width:100%;
        min-width:auto;
    }
}
</style>

<div class="page-wrapper">

    <div class="bottle-card">

        <div class="bottle-header">
            <h3>
                <i class="fas fa-wine-bottle"></i>
                {% if edit_mode %}
                    Edit Bottle
                {% else %}
                    Add Bottle
                {% endif %}
            </h3>
        </div>

        <div class="bottle-body">

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}success{% endif %}">
                        <i class="fas fa-check-circle me-2"></i>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="mb-4">
                    <label class="form-label">Bottle Name</label>

                    <input type="text"
                        name="bottle_name"
                        class="form-control"
                        placeholder="Enter Bottle Name"
                        value="{% if bottle %}{{ bottle.name }}{% endif %}"
                        required>
                </div>

                <div class="btn-wrapper">
                    <button type="submit" class="btn save-btn text-white">
                        {% if edit_mode %}
                            <i class="fas fa-pen me-2"></i>
                            Update Bottle
                        {% else %}
                            <i class="fas fa-circle-plus me-2"></i>
                            Save Bottle
                        {% endif %}
                    </button>
                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
