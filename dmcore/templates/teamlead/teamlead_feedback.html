{% extends "teamlead/teamleadsidebar.html" %}

{% block content %}
<style>
  /* Dark Theme Styles to match admin.html */
  .card {
    background-color: #333333;
    color: white;
    border: 1px solid #444;
    border-radius: 15px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  
  .card-header {
    background-color: #333333 !important;
    border-bottom: 1px solid #444;
    color: white !important;
  }
  
  .list-group-item {
    background-color: #333333;
    color: white;
    border: 1px solid #444;
  }
  
  .table {
    color: white;
    background-color: #333333;
  }
  
  .table td {
    border-color: #444;
    background-color: #333333 !important;
  }
  
  .table-hover tbody tr:hover {
    background-color: #3a3a3a !important;
  }
  
  .badge {
    color: white !important;
  }
  
  .bg-primary {
    background-color: #4a5568 !important; /* Dark blue-gray */
  }
  
  .bg-success {
    background-color: #2d6a4f !important; /* Dark green */
  }
  
  .bg-warning {
    background-color: #b88b4a !important; /* Dark orange */
    color: white !important;
  }
  
  .form-control, .form-select {
    background-color: #444;
    color: white;
    border: 1px solid #555;
  }
  
  .form-control:focus, .form-select:focus {
    background-color: #555;
    color: white;
    border-color: #666;
    box-shadow: 0 0 0 0.25rem rgba(100, 100, 100, 0.25);
  }
  
  .current-date {
    font-size: 1.1rem; /* Increased font size */
    opacity: 0.9; /* Increased opacity for better visibility */
    margin-top: 5px;
    text-align: center;
    width: 100%;
    display: block;
    font-weight: 500; /* Added slight weight */
  }
  
  .feedback-item {
    margin-bottom: 10px;
    padding: 10px;
    border-radius: 8px;
    background-color: #3a3a3a;
  }
  
  .employee-name {
    font-weight: bold;
    color: #b8c2cc;
  }
  
  .feedback-type {
    font-weight: bold;
  }
  
  .date-range {
    font-size: 0.85rem;
    color: #adb5bd;
  }
  
  .card-body {
    flex: 1 1 auto;
    overflow-y: auto;
    max-height: none;
  }
  
  .equal-height-row {
    display: flex;
    flex-wrap: wrap;
  }
  
  .equal-height-col {
    display: flex;
    flex-direction: column;
  }
  
  .action-icons {
    display: flex;
    gap: 10px;
  }
  
  .action-icons button {
    background: transparent;
    border: none;
    color: #adb5bd;
    padding: 0;
    font-size: 0.9rem;
  }
  
  .action-icons button:hover {
    color: white;
  }
  
  .resolve-icon {
    color: #2d6a4f;
  }
  
  .reject-icon {
    color: #e74c3c;
  }
  
  .status-badge {
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 0.8rem;
  }
  
  .status-pending {
    background-color: #b88b4a;
  }
  
  .status-resolved {
    background-color: #2d6a4f;
  }
  
  .status-rejected {
    background-color: #e74c3c;
  }
  
  /* Hide sections by default */
  #feedbackAddContent, #viewFeedbackContent {
    display: none;
  }
  
  .btn-toggle {
    background-color: #4a5568;
    color: white;
    border: none;
    padding: 0.375rem 0.75rem;
    border-radius: 0.25rem;
    font-size: 0.875rem;
  }
  
  .btn-toggle:hover {
    background-color: #5a6678;
  }
  
  .priority-high {
    color: #e74c3c;
  }
  
  .priority-medium {
    color: #f39c12;
  }
  
  .priority-low {
    color: #2ecc71;
  }


    /* Icon Button Styles */
  .circle-icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #4a5568;
    color: white;
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 0.9rem;
    transition: all 0.2s ease;
  }
  
  .circle-icon-btn:hover {
    background-color: #5a6678;
    transform: translateY(-2px);
  }
  
  .metric-badge {
    background-color: rgba(255, 255, 255, 0.15);
    padding: 2px 6px;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: bold;
    color: #4ade80; /* Green color for positive metrics */
  }
  

</style>

<div class="row equal-height-row mt-2 p-2">
  <div class="col-md-4 equal-height-col mb-3">
    <!-- View Feedback Section -->
 <div class="card shadow-sm mb-3">
    <div class="card-header">
      <div class="d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
          <h5 class="card-title mb-0">Feedback View</h5>
          <span class="metric-badge ms-2">+4.2%</span>
        </div>
        <button class="circle-icon-btn" id="btnShowViewFeedback">
          <i class="fas fa-arrow-right"></i>
        </button>
      </div>
    </div>
    <div class="card-body">
      <p>Review feedback added.</p>
    </div>
  </div>
  
  
    <!-- Add Feedback Section -->
  <div class="card shadow-sm">
    <div class="card-header">
      <div class="d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
          <h5 class="card-title mb-0">Add Feedback</h5>
          <span class="metric-badge ms-2">+5.7%</span>
        </div>
        <button class="circle-icon-btn" id="btnShowAddFeedback">
          <i class="fas fa-arrow-right"></i>
        </button>
      </div>
    </div>
    <div class="card-body">
      <p>Provide constructive feedback and suggestions to your team.</p>
    </div>
    </div>
  </div>

  <!-- Main Content Area -->
  <div class="col-md-8 equal-height-col mb-3">

    <!-- View Feedback Section Content (Initially Visible) -->
    <div class="card shadow-sm" id="viewFeedbackContent">
      <div class="card-header">
        <div class="d-flex justify-content-between align-items-center">
          <h5 class="card-title mb-0">View Feedback</h5>
        </div>
      </div>
      <div class="card-body">

<form id="feedbackSearchForm" method="post" class="mb-3">
  {% csrf_token %}
  <div class="row g-3 align-items-end">
    <div class="col-md-4">
      <label for="employeeFilter" class="form-label">Select Employee</label>
      <select class="form-select" id="employeeFilter" name="employee_id" required>

        <option value="">-- All Employees --</option>
        {% for e in employee %}
        <option value="{{ e.id }}">{{ e.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-3">
      <label for="fromDate" class="form-label">From Date</label>
      <input type="date" class="form-control" id="fromDate" name="from_date" required />
    </div>
    <div class="col-md-3">
      <label for="toDate" class="form-label">To Date</label>
      <input type="date" class="form-control" id="toDate" name="to_date" required />
    </div>
    <div class="col-md-2 d-flex">
      <button type="submit" class="btn btn-primary flex-grow-1">Search</button>
    </div>
  </div>
</form>

        <div class="table-responsive">
          <table class="table  table-bordered table-dark">
            <thead >
              <tr>
                <th scope="col">Date</th>
                <th scope="col">Employee</th>
                <th scope="col">Feedback</th>
              </tr>
            </thead>
            <tbody>
            </tbody>
          </table>
        </div>
      </div>
    </div>
    
    <!-- Add Feedback Section Content (Initially Hidden) -->
    <div class="card shadow-sm" id="feedbackAddContent" style="display: none;">
      <div class="card-header">
        <div class="d-flex justify-content-between align-items-center">
          <h5 class="card-title mb-0">Add Feedback</h5>
        </div>
      </div>

      <div class="card-body">
        <!-- Feedback Form -->
        <form id="feedbackForm">
  {% csrf_token %}
  <div class="mb-3">
    <label for="employeeSelector" class="form-label">Select Employee</label>
    <select class="form-select" id="employeeSelector" name="employee_id" required>
      <option value="">-- Select Employee --</option>
      {% for e in employee %}
      <option value="{{ e.id }}">{{ e.name }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="mb-3">
    <label for="feedbackDetails" class="form-label">Feedback</label>
    <textarea class="form-control" id="feedbackDetails" name="feedback_details" rows="4" placeholder="Provide detailed feedback" required></textarea>
  </div>

  <div class="d-grid">
    <button type="submit" class="btn btn-primary">
      <i class="bi bi-send"></i> Submit Feedback
    </button>
  </div>
</form>
      </div>
    </div>
  </div>
</div>

<script>
  // Wait for the DOM to be fully loaded
  document.addEventListener('DOMContentLoaded', function() {
    // Get references to all buttons and content sections
    const btnShowViewFeedback = document.getElementById('btnShowViewFeedback');
    const btnShowAddFeedback = document.getElementById('btnShowAddFeedback');
    
    const viewFeedbackContent = document.getElementById('viewFeedbackContent');
    const feedbackAddContent = document.getElementById('feedbackAddContent');
    
    // Function to show only the selected section
    function showOnlySection(sectionToShow) {
      // Hide all sections first
      viewFeedbackContent.style.display = 'none';
      feedbackAddContent.style.display = 'none';
      
      // Show the selected section
      sectionToShow.style.display = 'flex';
    }
    
    // Set up event listeners for buttons
    btnShowViewFeedback.addEventListener('click', function() {
      showOnlySection(viewFeedbackContent);
    });
    
    btnShowAddFeedback.addEventListener('click', function() {
      showOnlySection(feedbackAddContent);
    });
    
    // By default, show the view feedback content
    showOnlySection(viewFeedbackContent);
    
    
  });
</script>


<!--//////////////////////////////// add feedback /////////////////////////////////////////////-->

<script>
// Fixed version of the feedback submission script
document.addEventListener("DOMContentLoaded", function () {
  const feedbackForm = document.getElementById("feedbackForm");
  const employeeSelector = document.getElementById("employeeSelector");
  const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

  feedbackForm.addEventListener("submit", function (e) {
    e.preventDefault(); // prevent page refresh

    // Get the employee ID directly from the select element
    const employeeId = employeeSelector.value;
    
    // Check if an employee is selected (required attribute may not be enough)
    if (!employeeId || employeeId === "") {
      alert("Please select an employee");
      employeeSelector.focus();
      return;
    }

    // Get the feedback text
    const feedbackText = document.getElementById("feedbackDetails").value;
    
    // Instead of relying on FormData, create our own object and URLSearchParams
    const submitData = new URLSearchParams();
    submitData.append("csrfmiddlewaretoken", csrfToken);
    submitData.append("employee_id", employeeId);
    submitData.append("feedback_details", feedbackText);

    fetch("{% url 'teamlead_add_feedback' %}", {
      method: "POST",
      headers: {
        "X-CSRFToken": csrfToken,
        "Content-Type": "application/x-www-form-urlencoded",
      },
      body: submitData.toString(),
    })
    .then(response => response.json())
    .then(data => {
      if (data.success) {
        alert("Feedback submitted successfully!");
        feedbackForm.reset();
        // Show the view feedback section
        // document.getElementById("viewFeedbackContent").style.display = "flex";
        // document.getElementById("feedbackAddContent").style.display = "none";
      } else {
        alert("Error submitting feedback: " + (data.error || "Unknown error"));
      }
    })
    .catch(error => {
      console.error("Error:", error);
      alert("An error occurred. Please try again.");
    });
  });
});


</script>


<!--////////////////////////////////// feedback fetch ////////////////////////////////////////////////-->


<script>
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('feedbackSearchForm').addEventListener('submit', function (e) {
    e.preventDefault();

    const employeeId = document.getElementById('employeeFilter').value;
    const fromDate = document.getElementById('fromDate').value;
    const toDate = document.getElementById('toDate').value;
    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

    fetch('/teamlead_view_feedback/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': csrfToken
      },
      body: JSON.stringify({
        employee_id: employeeId,
        from_date: fromDate,
        to_date: toDate
      })
    })
    .then(response => {
      if (!response.ok) {
        throw new Error('Network response was not ok ' + response.statusText);
      }
      return response.json();
    })
    .then(data => {
      const tbody = document.querySelector('table tbody');
      tbody.innerHTML = '';

      if (data.feedbacks.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="text-center">No feedback found</td></tr>';
      } else {
        data.feedbacks.forEach(fb => {
          const row = `<tr>
            <td>${fb.date}</td>
            <td>${fb.employee}</td>
            <td>${fb.feedback}</td>
          </tr>`;
          tbody.innerHTML += row;
        });
      }
    })
    .catch(error => {
      console.error('Error fetching feedback:', error);
      alert('Failed to fetch feedback. Please try again.');
    });
  });
});  
</script>
