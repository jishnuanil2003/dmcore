      const isCompleted = $(this).prop('checked');
      const newStatus = isCompleted ? 'completed' : 'pending';
      
      console.log("Schedule ID:", scheduleId, "New status:", newStatus);
      
      // Submit status update via AJAX
      $.ajax({
        type: 'POST',
        url: '/teamlead_myschedule_status/',
        data: {
          'schedule_id': scheduleId,
          'status': newStatus,
          'csrfmiddlewaretoken': $('input[name=csrfmiddlewaretoken]').val()

          console.log("Status update response:", response);
          
          if (response.status === 'success') {
            console.log("Status updated successfully");
            
            // Apply or remove strikethrough based on checkbox state
            const scheduleItem = $(`.schedule-item[data-id="${scheduleId}"]`);
            const employeeName = scheduleItem.find('.employee-name');
            const scheduleName = scheduleItem.find('.schedule-name');
            
            if (isCompleted) {
              employeeName.addClass('text-decoration-line-through');
              scheduleName.addClass('text-decoration-line-through');

              employeeName.removeClass('text-decoration-line-through');
              scheduleName.removeClass('text-decoration-line-through');
            }
            
          } else {
            alert("Error updating status: " + response.message);
            // Revert checkbox state on error
            $(this).prop('checked', !isCompleted);
          }
        },
        error: function(xhr) {
          console.error("Status update error:", xhr.responseText);
          alert("Failed to update schedule status.");
          // Revert checkbox state on error
          $(this).prop('checked', !isCompleted);
        }
      });
    });
  });
</script>

<!-- Current day schedules loading script -->
<script>
  $(document).ready(function() {
    // Load current day schedules by default
    loadCurrentDaySchedules();
  });

function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let i = 0; i < cookies.length; i++) {
      const cookie = cookies[i].trim();
      if (cookie.substring(0, name.length + 1) === (name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}

function loadCurrentDaySchedules() {
  $.ajax({
    type: 'POST',
    url: '/get_teamlead_currentday_schedules/',
    headers: {
      "X-CSRFToken": getCookie('csrftoken')
    },
    success: function(response) {
      if (response.status === 'success') {
        // Populate schedule items
        populateScheduleItems(response.schedules);
        // Set display mode to current day
        currentDisplayMode = 'current_day';
      } else {
        console.error("Error loading current day schedules:", response.message);
      }
    },
    error: function(xhr) {
      console.error("AJAX error loading current day schedules:", xhr.responseText);
    }
  });
}
  
// Function to populate schedule items (shared by both current day and filtered schedules)
function populateScheduleItems(schedules) {
  const container = $('.schedule-items');
  container.empty();
  
  if (schedules.length === 0) {
    const message = currentDisplayMode === 'current_day' ? 
      "No schedules found for today." : 
      "No schedules found for selected dates.";
    container.append(`<p class="text-muted">${message}</p>`);
    return;
  }
  
  schedules.forEach((item) => {
    // Check if the task is completed to apply strikethrough
    const completedClass = item.schedule_status === 'completed' ? 'text-decoration-line-through' : '';
    const checkedAttr = item.schedule_status === 'completed' ? 'checked' : '';

    const formattedDate = new Date(item.schedule_date).toLocaleDateString('en-US', {
    year: 'numeric',
    month: 'long',
    day: 'numeric',
  });
    
    // Handle empty or undefined todo_content
    const todoContent = item.todo_content || 'No additional details';
    
const scheduleHTML = `
  <div class="schedule-item" data-id="${item.id}">
    <div class="d-flex justify-content-between align-items-start mb-3">
      <div class="employee-name ${completedClass}">${formattedDate}</div>
      
      <!-- Right side container pushed to the right -->
      <div class="d-flex flex-column align-items-end ms-3">
        <div class="d-flex justify-content-end align-items-start w-100">
          
          <!-- Subcontainer for head + content -->
          <div class="d-flex flex-column align-items-end">
            <div class="schedule-name ${completedClass}">${item.schedule_head}</div>
            <div class="schedule-content  mt-1 text-start">
              ${todoContent}
            </div>
          </div>

          <!-- Action buttons beside the head -->
          <div class="action-icons d-flex gap-1 ms-2">
            <button class="edit-icon" title="Edit" data-id="${item.id}"><i class="fas fa-edit"></i></button>
            <button class="delete-icon" title="Delete" data-id="${item.id}"><i class="fas fa-trash-alt"></i></button>
          </div>

        </div>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center">
      <div class="form-check">
        <input class="form-check-input status-toggle" type="checkbox" id="schedule${item.id}" 
          data-id="${item.id}" ${checkedAttr}>
        <div class="time-slot">Time - ${item.start_time} - ${item.end_time}</div>
      </div>
    </div>
  </div>`;
    
    container.append(scheduleHTML);
  });
}


</script>

{% endblock content %}
