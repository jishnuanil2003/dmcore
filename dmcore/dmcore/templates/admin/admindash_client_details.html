{% extends "admin/adminsidebar.html" %}
{% block content %}

<style>
    .border-left-primary { 
        border-left: .25rem solid #4e73df !important; 
    }
    .border-left-success { 
        border-left: .25rem solid #1cc88a !important; 
    }
    .card-link { 
        text-decoration: none !important; 
        color: inherit; 
    }
    .card-hover { 
        transition: transform 0.2s, box-shadow 0.2s; 
    }
    .card-hover:hover { 
        transform: translateY(-5px); 
        box-shadow: 0 10px 20px rgba(0,0,0,0.3) !important; 
        }
</style>

<div class="container-fluid mt-4">

    <div class="row mt-4">
        <div class="col-md-6 mb-4">
            <a href="{% url 'admindash_executives' company.id client.id %}" class="card-link">
                <div class="card bg-dark text-white shadow h-100 border-left-primary card-hover">
                    <div class="card-body py-4">
                        <div class="row no-gutters align-items-center">
                            <div class="col mr-2">
                                <div class="h5 mb-0 font-weight-bold">Executives</div>
                                <p class="text-white-50 small mt-2">Manage and view all field executives assigned to this company.</p>
                            </div>
                            <div class="col-auto">
                                <i class="fas fa-user-tie fa-3x text-gray-500"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-md-6 mb-4">
            <a href="{% url 'admindash_telecallers' company.id client.id %}" class="card-link">
                <div class="card bg-dark text-white shadow h-100 border-left-success card-hover">
                    <div class="card-body py-4">
                        <div class="row no-gutters align-items-center">
                            <div class="col mr-2">
                                <div class="h5 mb-0 font-weight-bold">Telecallers</div>
                                <p class="text-white-50 small mt-2">Manage and monitor telecalling staff and their calling performance.</p>
                            </div>
                            <div class="col-auto">
                                <i class="fas fa-headset fa-3x text-gray-500"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </a>
        </div>
    </div>
</div>

{% endblock content %}
