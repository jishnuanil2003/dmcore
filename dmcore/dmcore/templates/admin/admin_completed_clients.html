{% extends "admin/adminsidebar.html" %}
{% load static %}
{% block title %}Completed Clients{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'dm_head/css/common.css' %}">
<link rel="stylesheet" href="{% static 'admin/css/admin_completed_clients.css' %}">


<div class="row mb-3 mt-3">
    <div class="col-12">
      <p class="text-white-50 mb-0"><a href="{% url 'admin_employee' %}" class="text-decoration-none text-white">Employees</a> / 
      <a href="{% url 'admin_works' %}" class="text-decoration-none text-white">Works</a> / 
    <a href="{% url 'admin_clients' %}" class="text-decoration-none text-white">Clients</a> / Completed</p>
    </div>
  </div>

<div class="container-fluid py-3">

  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <h4 class="mb-0 text-white">Completed Clients</h4>
  </div>

  <div class="card admin-glass mb-3">
    <div class="card-body">
      <div class="row g-3 align-items-end">

        <div class="col-12 col-md-4">
          <label class="form-label text-white-50">Client Name</label>
          <select id="clientSelect" class="form-select">
            <option value="" selected disabled>Select Client</option>
          </select>          
        </div>

        <div class="col-6 col-md-3">
          <label class="form-label text-white-50">From Date</label>
          <input type="date" id="fromDate" class="form-control">
        </div>

        <div class="col-6 col-md-3">
          <label class="form-label text-white-50">To Date</label>
          <input type="date" id="toDate" class="form-control">
        </div>

        <div class="col-12 col-md-2 d-flex gap-2">
          <button id="applyFilterBtn" class="btn btn-light w-100">Apply</button>
          <button id="resetFilterBtn" class="btn btn-outline-light w-100">Reset</button>
        </div>

      </div>
    </div>
  </div>

  <div class="card admin-glass">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-dark table-hover align-middle mb-0">
          <thead>
            <tr>
              <th style="width: 70px;">No</th>
              <th style="width: 140px;">Registered Date</th>
              <th>Client Name</th>
              <th>Email</th>
              <th style="width: 140px;">Phone</th>
              <th>Address</th>
              <th style="width: 120px;">Status</th>
            </tr>
          </thead>
          <tbody id="clientsTbody">
            <tr>
              <td colspan="7" class="text-center text-white-50 py-4">Loading...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script>
  window.__completedClientsDataUrl = "{% url 'admin_completed_clients_data' %}";
</script>
<script src="{% static 'admin/js/admin_completed_clients.js' %}"></script>
{% endblock %}
