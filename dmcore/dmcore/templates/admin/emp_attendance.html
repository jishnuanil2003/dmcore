{% extends "admin/adminsidebar.html" %}
{% block content %}
{% load static %}

<style>
.card-common {
    border: none;
    border-radius: 18px;
    background: linear-gradient(135deg, #1f2937, #374151);
    min-height: 140px;
    padding: 20px;
    transition: all 0.3s ease;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    overflow: hidden;
    position: relative;
}

.card-common:hover {
    transform: translateY(-8px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
}

.card-link {
    color: #fff;
    height: 100%;
}

.card-title {
    font-size: 1.3rem;
    font-weight: 600;
    margin-bottom: 0;
}

.card-icon {
    font-size: 2.5rem;
    opacity: 0.9;
}

.card-subtitle {
    color: rgba(255,255,255,0.75);
    font-size: 0.9rem;
    margin-top: 10px;
}

@media (max-width: 768px) {
    .card-common {
        min-height: 120px;
    }

    .card-icon {
        font-size: 2rem;
    }
}
</style>

<div class="container mt-4">
    <div class="row g-4">

        <!-- Executive Card -->
        <div class="col-md-4">
            <div class="card card-common">
                <a href="{% url 'exec_attendence' %}" class="text-decoration-none card-link d-flex flex-column justify-content-between">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5 class="card-title">Executive</h5>
                        <i class="fa-solid fa-users card-icon text-warning"></i>
                    </div>

                    <div class="card-subtitle">
                        View executive attendance details
                    </div>
                </a>
            </div>
        </div>

        <!-- Telecaller Card -->
        <div class="col-md-4">
            <div class="card card-common">
                <a href="{% url 'telecaller_attendence' %}" class="text-decoration-none card-link d-flex flex-column justify-content-between">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5 class="card-title">Telecaller</h5>
                        <i class="fas fa-headset card-icon text-success"></i>
                    </div>

                    <div class="card-subtitle">
                        View telecaller attendance details
                    </div>
                </a>
            </div>
        </div>

    </div>
</div>

{% endblock %}
