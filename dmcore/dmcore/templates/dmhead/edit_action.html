{% extends "dmhead/dmheadsidebar.html" %}

{% block content %}
<div class="container text-white" style="max-width: 900px;">
  <h4 class="mb-4"  style="margin-top:20px;">Take Actions</h4>

  <form method="post" class="bg-dark p-4 rounded">
    {% csrf_token %}
    
    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label">Select Employee</label>
        <select class="form-select bg-dark text-white border-secondary" name="employee">
          {% for employee in employees %}
            <option value="{{ employee.id }}" {% if employee.id == action_taken.employee.id %}selected{% endif %}>
              {{ employee.name }} - {{ employee.designation }}
            </option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Date</label>
        <input type="text" class="form-control bg-dark text-white border-secondary" name="date" value="{{ action_taken.action_date|date:'d-m-Y' }}" />
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Reason</label>
      <input type="text" class="form-control bg-dark text-white border-secondary" name="reason" value="{{ action_taken.act_reason }}" />
    </div>

    <div class="mb-3">
      <label class="form-label">Reason for action ?</label>
      <textarea class="form-control bg-dark text-white border-secondary" name="reason_action" rows="3">{{ action_taken.act_head }}</textarea>
    </div>

    <div class="mb-4">
      <label class="form-label">What action taken ?</label>
      <textarea class="form-control bg-dark text-white border-secondary" name="action_taken" rows="3">{{ action_taken.act_content }}</textarea>
    </div>

    

    <div class="text-center">
      <button type="submit" class="btn btn-primary">
        <i class="fas fa-edit"></i> Edit
      </button>
    </div>
  </form>
</div>
{% endblock %}
