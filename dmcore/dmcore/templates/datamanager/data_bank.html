{% extends "datamanager/datamanagersidebar.html" %}
{% load static %}
{% block content %}

<link rel="stylesheet" href="{% static 'datamanager/css/databank.css' %}">
<link rel="stylesheet" href="{% static 'datamanager/css/common.css' %}">
<nav aria-label="breadcrumb" class="mb-3">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{% url 'manager' %}" class="text-decoration-none text-white">Dashboard</a></li>
    <li class="breadcrumb-item active text-white-50" aria-current="page">Data Bank</li>
  </ol>
</nav>


<div class="container-fluid mt-3 comn_table_bg">
  <h4 class="text-white mb-4">Leads (<span class="text-white" id="leadCount">0</span>)</h4>

  <div class="row g-3 mb-3">
    <div class="col-md-2">
      <!--// <label class="form-label text-white">Client</label> -->
      <select id="clientSelect" class="form-select">
        <option value="">All Clients</option>
        {% for client in clients %}
        <option value="{{ client.id }}">{{ client.client_name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="col-md-2">
      <!--// <label class="form-label text-white">Category</label> -->
      <select id="categorySelect" class="form-select">
        <option value="">All Categories</option>
        {% for category in categories %}
          <option value="{{ category.id }}">{{ category.collection_for }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="col-md-2">
      <!--// <label class="form-label text-white">HR</label> -->
      <select id="hrFilter" class="form-select">
        <option value="">All Executives</option>
        {% for h in hrs %}
          <option value="{{ h.id }}">{{ h.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="col-md-2">
      <!--// <label class="form-label text-white">Start Date</label> -->
      <input type="date" id="startDate" class="form-control">
    </div>

    <div class="col-md-2">
      <!--// <label class="form-label text-white">End Date</label> -->
      <input type="date" id="endDate" class="form-control">
    </div>

    <div class="col-md-2">
      <!--// <label class="form-label text-white">Status</label> -->
      <select id="statusSelect" class="form-select">
        <option value="">All Statuses</option>
        <option value="Not Allocated">Not Allocated</option>
        <option value="Allocated">Allocated</option>
        <option value="Closed">Closed</option>
        <option value="Opened">Opened</option>
      </select>
    </div>

    <div class="col-md-2">
      <!--// <label class="form-label text-white"></label> -->
      <button id="clearFilters" class="btn btn-outline-light w-100 mt-2">Clear Filters</button>
    </div>


  </div>

  <div class="d-flex justify-content-between align-items-center mb-2">
    <div>
      <!--// <label class="text-white me-2">Show</label> -->
      <select id="rowCount" class="form-select d-inline-block w-auto bg-dark text-white">
        <option value="10">10</option>
        <option value="25" selected>25</option>
        <option value="50">50</option>
      </select>
      <!--// <label class="text-white ms-2">rows</label> -->
    </div>

    <div class="input-group w-auto mb-3 print-hide">
      <input type="text" id="searchInput" class="form-control bg-dark text-white" placeholder="Search...">
      <button class="btn btn-light" id="clearSearch">Clear</button>
    </div>
  </div>

  <div id="leadMessage" class="alert d-none" role="status"></div>
  <form class="d-none">{% csrf_token %}</form>
  <div class="table-responsive" id="tableWrapper">
    <table id="dataBankTable" class="table table-dark table-striped table-hover">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email Id</th>
          <th>Contact</th>
          <th>Source</th>
          <th>Category</th>
          <th>Collected By</th>
          <th>Add Date</th>
          <th>Status</th>
          <th>Details</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="leadsTableBody"></tbody>
    </table>
  </div>

  <div id="leadsLoading" class="text-white text-center mt-3">Loading leads...</div>
  <div id="noDataMessage" class="text-white text-center mt-3 d-none">
    <h5>No leads found.</h5>
  </div>
  <div class="d-flex justify-content-between align-items-center mt-3">
    <span id="paginationSummary" class="text-white-50"></span>
    <div>
      <button id="previousPage" class="btn btn-outline-light btn-sm" type="button">Previous</button>
      <span id="pageSummary" class="text-white mx-2"></span>
      <button id="nextPage" class="btn btn-outline-light btn-sm" type="button">Next</button>
    </div>
  </div>

</div>
<script src="{% static 'datamanager/js/databank.js' %}?v=20261026-1"></script>

{% endblock content %}
